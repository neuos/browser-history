version: '3.8'

services:
  history-sync:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/history.db
      - SHARED_SECRET=${SHARED_SECRET:-your-secret-key-change-this}
      - JWT_SECRET=${JWT_SECRET:-another-secret-key-change-this}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  history-data:
