# Browser History API - Development Setup

version: '3.8'

services:
  browser-history-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: build  # Use build stage for development
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/browser-history-dev.db
      - Serilog__WriteTo__1__Args__path=/app/logs/browser-history-dev-.txt
      - Jwt__Secret=development-secret-key-that-is-at-least-32-characters-long
      - Auth__SharedSecret=development-shared-secret
      - Serilog__MinimumLevel__Default=Debug
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - .:/app/src:ro  # Mount source for development
    restart: unless-stopped
    command: dotnet watch run --project BrowserHistory.Api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  dev_data:
    driver: local
  dev_logs:
    driver: local
