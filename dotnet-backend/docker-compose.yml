version: '3.8'

services:
  browser-history-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/browser-history.db
      - Serilog__WriteTo__1__Args__path=/app/logs/browser-history-.txt
      - Jwt__Secret=your-super-secret-jwt-key-that-is-at-least-32-characters-long
      - Auth__SharedSecret=your-shared-secret-for-device-registration
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - browser-history-api
    restart: unless-stopped
    profiles:
      - production

volumes:
  browser_history_data:
    driver: local
  browser_history_logs:
    driver: local

networks:
  default:
    name: browser-history-network
